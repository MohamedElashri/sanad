name: CI
on:
  push:
    branches:
      - main
      - "!dependabot/**"
  pull_request:
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - run: go vet ./...
      - run: go test ./...
      - name: Build CLI and pinned backend
        shell: bash
        run: |
          go build -ldflags "-X github.com/MohamedElashri/sanad/internal/cli.version=$(cat VERSION)" -o "$RUNNER_TEMP/sanad${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/sanad
          go run ./scripts/package-backend --native --output "$RUNNER_TEMP/gh-actions-lock${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Test official backend contract
        shell: bash
        env:
          SANAD_TEST_BACKEND: ${{ runner.temp }}/gh-actions-lock${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test ./internal/sanad -run TestNativeBackendContract -v
      - run: npm ci --prefix action
      - run: npm test --prefix action
      - name: Test Action against built CLI
        shell: bash
        env:
          SANAD_ACTION_BINARY: ${{ runner.temp }}/sanad${{ runner.os == 'Windows' && '.exe' || '' }}
          SANAD_BACKEND: ${{ runner.temp }}/gh-actions-lock${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm run test:integration --prefix action
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: test -z "$(gofmt -l cmd internal scripts)"
      - run: npm ci --prefix action
      - name: Build action bundle for Dependabot
        if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix action
          git add action/dist
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(action): update dist bundle for dependabot [dependabot skip]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - run: npm run check-dist --prefix action
