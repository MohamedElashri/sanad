name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - run: go vet ./...
      - run: go test ./...
      - name: Build CLI and pinned backend
        shell: bash
        run: |
          go build -ldflags "-X github.com/MohamedElashri/sanad/internal/cli.version=$(cat VERSION)" -o "$RUNNER_TEMP/sanad${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/sanad
          go run ./scripts/package-backend --native --output "$RUNNER_TEMP/gh-actions-lock${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Test official backend contract
        shell: bash
        env:
          SANAD_TEST_BACKEND: ${{ runner.temp }}/gh-actions-lock${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test ./internal/sanad -run TestNativeBackendContract -v
      - run: npm ci --prefix action
      - run: npm test --prefix action
      - name: Test Action against built CLI
        shell: bash
        env:
          SANAD_ACTION_BINARY: ${{ runner.temp }}/sanad${{ runner.os == 'Windows' && '.exe' || '' }}
          SANAD_BACKEND: ${{ runner.temp }}/gh-actions-lock${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm run test:integration --prefix action
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: test -z "$(gofmt -l cmd internal scripts)"
      - run: npm ci --prefix action
      - run: npm run check-dist --prefix action
