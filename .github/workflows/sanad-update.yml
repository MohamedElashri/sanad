name: Sanad updates
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    # Use the reviewed PR lifecycle fix until the next Sanad release.
    uses: MohamedElashri/sanad/.github/workflows/update-pr.yml@31accee9e8700a53b46a780b0deba2d9d1014b55
    secrets:
      token: ${{ secrets.SANAD_TOKEN }}
