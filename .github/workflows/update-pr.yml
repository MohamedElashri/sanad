name: Sanad update pull request
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .sanad.toml
      branch:
        type: string
        default: sanad/updates
      base:
        type: string
        default: ''
    secrets:
      token:
        required: true
    outputs:
      pr-url:
        description: Update pull request URL
        value: ${{ jobs.update.outputs.pr-url }}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sanad-update-${{ github.repository }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pr-url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Require workflow update credentials
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.token }}
          BUILTIN_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$UPDATE_TOKEN" ] || [ "$UPDATE_TOKEN" = "$BUILTIN_TOKEN" ]; then
            echo '::error::Supply a GitHub App or personal access token with Contents, Workflows, and Pull requests write permissions. GITHUB_TOKEN cannot update workflow files.'
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base || github.event.repository.default_branch }}
          token: ${{ secrets.token }}
      - id: update
        uses: $/action
        with:
          mode: update
          write: 'true'
          config: ${{ inputs.config }}
          token: ${{ secrets.token }}
      - id: pr
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base || github.event.repository.default_branch }}
          CHANGED_FILES: ${{ steps.update.outputs.changed-files }}
          PR_BODY: ${{ steps.update.outputs.pr-body-path }}
        run: |
          git check-ref-format --branch "$UPDATE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$UPDATE_BRANCH"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          files = json.loads(os.environ['CHANGED_FILES'])
          for name in files:
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or '\\' in name:
                  raise SystemExit('Unsafe managed path')
          subprocess.run(['git', 'add', '--', *files], check=True)
          PY
          git -c commit.gpgsign=false commit -m 'ci: update Actions dependencies and observations'
          git push --force-with-lease origin "$UPDATE_BRANCH"
          pr_ref="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')"
          if [ -n "$pr_ref" ]; then
            gh pr edit "$pr_ref" --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --title 'ci: update Actions dependencies' --body-file "$PR_BODY"
          else
            pr_ref="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --title 'ci: update Actions dependencies' --body-file "$PR_BODY")"
          fi
          gh pr view "$pr_ref" --repo "$GITHUB_REPOSITORY" --json url --jq '"url=" + .url' >> "$GITHUB_OUTPUT"
