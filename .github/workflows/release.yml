name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # sanad: ref=v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # sanad: ref=v6.4.0
        with:
          go-version: "1.26.x"
      - name: Determine release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # sanad: ref=v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Update Nix flake release
        run: >-
          go run ./scripts/update-flake-release
          --version "${{ steps.release-version.outputs.version }}"
          --checksums "dist/sanad_${{ steps.release-version.outputs.version }}_checksums.txt"
      - name: Open Nix flake update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- flake.nix; then
            echo "flake.nix already matches v${{ steps.release-version.outputs.version }}"
            exit 0
          fi

          branch="release/flake-v${{ steps.release-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.nix
          git commit -m "chore: update flake for v${{ steps.release-version.outputs.version }}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: update flake for v${{ steps.release-version.outputs.version }}" \
              --body "Updates flake.nix to use the v${{ steps.release-version.outputs.version }} release archives and fixed-output hashes generated by GoReleaser."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update flake for v${{ steps.release-version.outputs.version }}" \
              --body "Updates flake.nix to use the v${{ steps.release-version.outputs.version }} release archives and fixed-output hashes generated by GoReleaser."
          fi
