name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: action/package-lock.json
      - name: Verify action release sources
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_GITHUB_TOKEN" || { echo "::error::Homebrew publishing token is missing"; exit 1; }
          tag_version="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$tag_version"
          test "$(node -p 'require("./action/package.json").version')" = "$tag_version"
          npm ci --prefix action
          test "$(node -p 'require("./action/node_modules/@actions/core/package.json").version')" = "1.11.1"
          node -e 'require("./action/node_modules/@actions/core")'
          npm test --prefix action
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
      - name: Determine release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        run: |
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          changelog = Path("CHANGELOG.md").read_text()
          section = changelog.split(f"## {version} - ", 1)[1]
          notes = section.split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Release notes are empty")
          Path(os.environ["RUNNER_TEMP"], "sanad-release-notes.md").write_text(notes + "\n")
          PYNOTES
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes "${{ runner.temp }}/sanad-release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Generate release dependency inventories
        run: |
          go run ./scripts/release-sbom --dir dist
          npm sbom --prefix action --sbom-format spdx --omit dev > "dist/sanad_action_${GITHUB_REF_NAME#v}.spdx.json"
          # SPDX 2.3 timestamps require whole UTC seconds; npm emits milliseconds.
          node -e 'const fs = require("fs"); const p = process.argv[1]; const d = JSON.parse(fs.readFileSync(p)); d.creationInfo.created = d.creationInfo.created.replace(/\.\d+Z$/, "Z"); fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");' "dist/sanad_action_${GITHUB_REF_NAME#v}.spdx.json"
      - name: Attest release artifacts and inventories
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/sanad_*.tar.gz
            dist/sanad_*.zip
            dist/sanad_*_checksums.txt
            dist/*.spdx.json
      - name: Attach dependency inventories to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.spdx.json
      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)"
          if [ "$immutable" != "true" ]; then
            echo "::error::Release $GITHUB_REF_NAME is mutable. Enable repository release immutability before creating the next release; GitHub does not retrofit immutability onto existing releases."
            exit 1
          fi
          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "false" ]; then
            echo "::error::Release $GITHUB_REF_NAME was not published successfully."
            exit 1
          fi
      - name: Retire the old Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          formula_sha="$(gh api "repos/MohamedElashri/homebrew-sanad/git/trees/main?recursive=1" --jq '.tree[] | select(.path == "Formula/sanad.rb") | .sha')"
          if [ -n "$formula_sha" ]; then
            gh api --method DELETE repos/MohamedElashri/homebrew-sanad/contents/Formula/sanad.rb \
              -f branch=main -f sha="$formula_sha" \
              -f message='Retire Sanad formula in favor of the 1.0 cask'
          fi
      - name: Update Nix flake release
        run: >-
          go run ./scripts/update-flake-release
          --version "${{ steps.release-version.outputs.version }}"
          --checksums "dist/sanad_${{ steps.release-version.outputs.version }}_checksums.txt"
      - name: Open Nix flake update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- flake.nix; then
            echo "flake.nix already matches v${{ steps.release-version.outputs.version }}"
            exit 0
          fi

          branch="release/flake-v${{ steps.release-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.nix
          git commit -m "chore: update flake for v${{ steps.release-version.outputs.version }}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: update flake for v${{ steps.release-version.outputs.version }}" \
              --body "Updates flake.nix to use the v${{ steps.release-version.outputs.version }} release archives and fixed-output hashes generated by GoReleaser."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update flake for v${{ steps.release-version.outputs.version }}" \
              --body "Updates flake.nix to use the v${{ steps.release-version.outputs.version }} release archives and fixed-output hashes generated by GoReleaser."
          fi

  smoke:
    name: Published release (${{ matrix.os }})
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download and verify the published release through the Action
        uses: $/action
        with:
          mode: setup
      - name: Initialize a minimal repository using the bundled backend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-smoke/.github/workflows
          printf 'name: smoke\non: push\njobs:\n  smoke:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo smoke\n' > .release-smoke/.github/workflows/ci.yml
          sanad init --root .release-smoke --repo "$GITHUB_REPOSITORY" --confirm-native --write
      - name: Verify the initialized repository through the published Action
        uses: $/action
        with:
          mode: check
          working-directory: .release-smoke
