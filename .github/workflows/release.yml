name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # sanad: ref=v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: action/package-lock.json
      - name: Verify action release sources
        run: |
          test "$(node -p 'require("./action/package.json").version')" = "${GITHUB_REF_NAME#v}"
          npm ci --prefix action
          npm test --prefix action
          npm run check-dist --prefix action
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
        with:
          go-version: "1.26.x"
      - name: Determine release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # sanad: ref=v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)" = "true"
          gh release verify "$GITHUB_REF_NAME"
      - name: Update Nix flake release
        run: >-
          go run ./scripts/update-flake-release
          --version "${{ steps.release-version.outputs.version }}"
          --checksums "dist/sanad_${{ steps.release-version.outputs.version }}_checksums.txt"
      - name: Open Nix flake update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- flake.nix; then
            echo "flake.nix already matches v${{ steps.release-version.outputs.version }}"
            exit 0
          fi

          branch="release/flake-v${{ steps.release-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.nix
          git commit -m "chore: update flake for v${{ steps.release-version.outputs.version }}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: update flake for v${{ steps.release-version.outputs.version }}" \
              --body "Updates flake.nix to use the v${{ steps.release-version.outputs.version }} release archives and fixed-output hashes generated by GoReleaser."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update flake for v${{ steps.release-version.outputs.version }}" \
              --body "Updates flake.nix to use the v${{ steps.release-version.outputs.version }} release archives and fixed-output hashes generated by GoReleaser."
          fi
