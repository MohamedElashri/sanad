name: Sanad
description: Adopt, verify, and update native GitHub Actions lockfiles
author: Mohamed Elashri
inputs:
  mode:
    description: check, status, plan, sync, update, or setup
    default: check
  config:
    description: Repository-relative Sanad policy file
    default: .sanad.toml
  working-directory:
    description: Repository directory inside the workspace
    default: .
  write:
    description: Apply changes in sync or update mode
    default: 'false'
  base:
    description: Trusted base commit for checking adoption policy on a pull request
    default: ''
  token:
    description: Token for the repository's GitHub host
    default: ${{ github.token }}
outputs:
  passed:
    description: Whether verification and policy passed
  changed:
    description: Whether repository files changed
  changed-files:
    description: JSON array of files changed by this run
  updates:
    description: Number of eligible updates
  pending:
    description: Number of waiting candidates
  report-path:
    description: Complete JSON report
  pr-body-path:
    description: Markdown review summary
  sanad-version:
    description: Exact Sanad CLI version
runs:
  using: node24
  main: action/dist/index.js
branding:
  icon: shield
  color: green
