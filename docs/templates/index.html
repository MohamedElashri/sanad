{{- define "index" -}}{{ template "base" . }}{{- end }}
{{- define "content" -}}
<div class="docs-layout docs-layout-home">
  <aside class="side-nav" aria-label="Documentation navigation">
    {{ template "docs-nav" . }}
  </aside>
  <article class="article-shell home-article">
    <p class="section-label">Documentation</p>
    <h1>{{ .Config.Title }}</h1>
    <p class="lede">{{ .Config.Description }}</p>
    <div class="prose">{{ safeHTML .Section.BodyHTML }}</div>

    <div class="quick-actions">
      <a class="button primary" href="{{ .BasePath }}/guide/getting-started/">Get started</a>
      <a class="button secondary" href="{{ .BasePath }}/reference/cli/">CLI reference</a>
    </div>


  </article>
</div>
{{- end }}
