version: 2

project_name: sanad

before:
  hooks:
    - go mod download

builds:
  - id: sanad
    main: ./cmd/sanad
    binary: sanad
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/MohamedElashri/sanad/internal/cli.version={{ .Version }}
        -X github.com/MohamedElashri/sanad/internal/cli.commit={{ .Commit }}
        -X github.com/MohamedElashri/sanad/internal/cli.date={{ .Date }}

archives:
  - id: sanad
    ids:
      - sanad
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - .sanad.toml.example

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

brews:
  - name: sanad
    ids:
      - sanad
    directory: Formula
    homepage: https://github.com/MohamedElashri/sanad
    description: Pin and update GitHub Actions dependencies to immutable commit SHAs
    license: MIT
    repository:
      owner: MohamedElashri
      name: homebrew-sanad
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    install: |
      bin.install "sanad"
      generate_completions_from_executable(bin/"sanad", "completion", shells: [:bash, :zsh, :fish, :pwsh])
    test: |
      assert_match version.to_s, shell_output("#{bin}/sanad version")

release:
  draft: true
  github:
    owner: MohamedElashri
    name: sanad

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
