version: 2

project_name: sanad

before:
  hooks:
    - go mod download
    - go run ./scripts/package-backend

builds:
  - id: sanad
    main: ./cmd/sanad
    binary: sanad
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/MohamedElashri/sanad/internal/cli.version={{ .Version }}
        -X github.com/MohamedElashri/sanad/internal/cli.commit={{ .Commit }}
        -X github.com/MohamedElashri/sanad/internal/cli.date={{ .Date }}

archives:
  - id: sanad
    ids:
      - sanad
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - .sanad.toml.example
      - src: .release-tools/{{ .Os }}_{{ .Arch }}/gh-actions-lock{{ if eq .Os "windows" }}.exe{{ end }}
        strip_parent: true
      - src: licenses/gh-actions-lock.txt
        dst: licenses
        strip_parent: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: sanad
    ids:
      - sanad
    directory: Casks
    homepage: https://github.com/MohamedElashri/sanad
    description: Adopt and update native GitHub Actions lockfiles
    repository:
      owner: MohamedElashri
      name: homebrew-sanad
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    binaries:
      - sanad
      - gh-actions-lock
    generate_completions_from_executable:
      executable: sanad
      args: [completion]
      shell_parameter_format: arg
      shells: [bash, zsh, fish]

release:
  draft: true
  github:
    owner: MohamedElashri
    name: sanad

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
